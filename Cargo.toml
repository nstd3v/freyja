[workspace]
resolver = "3"
members = ["crates/freyja","crates/freyja-core", "crates/freyja-extension-oci"]

[workspace.dependencies]
freyja-core = { path = "crates/freyja-core" }
freyja-extension-oci = { path = "crates/freyja-extension-oci" }
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
oci-client = "0.17.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
